spring:

  # PostgreSQL
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/tenjudge
    username: postgres
    password: "051223"

  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16      # 最大连接数
          max-idle: 8       # 最大空闲连接
          min-idle: 0        # 最小空闲连接
          max-wait: 1000ms    # 连接等待时间

  # RabbitMQ
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    virtual-host: tenjudge
    username: admin
    password: "051223"
    listener:
      simple:
        prefetch: 1



# MinIO
minio:
  endpoint: http://127.0.0.1:9000
  access-key: root
  secret-key: 12345678
  bucket-name: tenjudge

# App
app:
  auth:
    super-admin-username: admin # 默认超级管理员用户名
    super-admin-password: "12345678" # 默认超级管理员密码
    super-admin-email: "super_admin@tenjudge.com" # 默认超级管理员邮箱
    role-cache-expire: 3600 # 角色权限缓存过期时间（单位：秒）
  file-storage:
    temp: "/Users/shaun/Workspace/Data/TenJudge/temp"