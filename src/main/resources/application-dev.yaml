spring:

  # PostgreSQL
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16      # 最大连接数
          max-idle: 8       # 最大空闲连接
          min-idle: 0        # 最小空闲连接
          max-wait: 1000ms    # 连接等待时间

# MyBatis
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mappers/**/*.xml

sa-token:
  token-name: tenjudge-token # token 名称（同时也是 cookie 名称）
  timeout: 3600 # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  active-timeout: -1 # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: tenjudge

# App
app:
  file-storage:
    data: "/Users/shaun/Workspace/Data/TenJudge/data"
    temp: "/Users/shaun/Workspace/Data/TenJudge/temp"